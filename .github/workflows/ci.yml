name: Engine checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'
      - run: dotnet restore FindEverything.sln --locked-mode
      - run: dotnet build FindEverything.sln --configuration Release --no-restore
      - run: dotnet test FindEverything.sln --configuration Release --no-build --logger trx
